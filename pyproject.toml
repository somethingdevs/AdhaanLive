[project]
name = "adhaan-streamer"
version = "0.1.0"
description = "Plays mosque livestream automatically at Adhaan time"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "fastapi",
  "requests",
  "numpy",
  "pyyaml",
  "ffmpeg-python",
]

[project.optional-dependencies]
local-audio = [
  "sounddevice",
  "pyaudio",
  "soundfile",
]

